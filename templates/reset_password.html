{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="col-md-5">
        <div class="card bg-dark text-white">
            <div class="card-header">Nova lozinka</div>
            <div class="card-body">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endwith %}
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label text-white">Nova lozinka</label>
                        <input type="password" name="password" class="form-control" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white">Ponovi lozinku</label>
                        <input type="password" name="confirm_password" class="form-control" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-success w-100">Postavi novu lozinku</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
